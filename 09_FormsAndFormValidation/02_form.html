<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email & Password Validator</title>
  <link rel="stylesheet" href="02_form.css"> <!-- External CSS link -->
</head>
<body>
  <div class="container">
    <h2>Email & Password Validator</h2>
    <form autocomplete="off" id="loginForm">
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="text" id="email" placeholder="Enter your email">
        <p class="error" id="emailError">Invalid email format</p>
      </div>
      
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password">
        <p class="error" id="passwordError">Password must be at least 6 characters</p>
      </div>
      
      <button type="submit">Validate</button>
    </form>

    <div id="resultMessage">
    </div>
  </div>

  <!-- Yaha tu apna JS likh lega -->
  <script src="02_form.js"></script>
</body>
