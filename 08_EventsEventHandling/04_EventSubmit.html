<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
               *{
            margin: 0;
            padding: 0;
            font-family: "Gilroy";
            box-sizing: border-box;
        }

        html, body{
            width:100%;
            height: 100%;
        }

        #main{
            padding: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: #222;
        }

        input{
            display: block;
            background-color: bisque;
            height: 40px;
            width: 200px;
            border-radius: 10px;
        }

        .card{
            max-width: 200px;
            color: antiquewhite;
            margin-top: 40px;
            border-radius: 10px;
            display: inline-block;
            padding: 20px;
            border: 2px solid #555;
        }

        .card p{
            font-size: 12px;
            margin-top: 10px;
        }

        .card h3{
            margin-top: 5px;

        }

        .profile{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 7px;
            overflow: hidden;
        }

        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        

    </style>
</head>
<body>
    <div id="main">
        <form action="">
            <input type="text" placeholder="Profile Pic">
            <input type="text" placeholder="Name">
            <input type="text" placeholder="Occupation">
            <input type="text" placeholder="info">
            <input type="submit">
        </form>
    </div>
        
</body>
<script src = "04_Event.js"></script>
</html>
